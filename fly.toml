# Fly.io config for the game server. Deploy with: fly deploy
app = "krabbel-server" # change to your own app name
primary_region = "ams"

[build]
  dockerfile = "apps/server/Dockerfile"

[env]
  PORT = "4000"
  # CORS_ORIGIN = "https://your-app.vercel.app"

[http_service]
  internal_port = 4000
  force_https = true
  # Game state lives in memory: keep exactly one machine running.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "connections"
    soft_limit = 500
    hard_limit = 1000

[[http_service.checks]]
  interval = "15s"
  timeout = "5s"
  grace_period = "10s"
  method = "GET"
  path = "/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
